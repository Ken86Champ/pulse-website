<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE – Dein persönliches Coaching beginnt hier</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#211936;background:#f7f5fc}*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:white;box-shadow:0 12px 70px #28165b12}header{padding:18px 24px;border-bottom:1px solid #eeeaf5;display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#693af0;color:white;font-weight:800}.sub{font-size:12px;color:#756f84}.bar{height:4px;background:#eeeaf5}.fill{height:100%;background:#693af0;transition:width .3s}main{flex:1;padding:28px 22px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:88%;padding:14px 17px;border-radius:17px;line-height:1.55;font-size:15px;white-space:pre-line}.bot{background:#f1eef9;align-self:flex-start;border-bottom-left-radius:4px}.me{background:#e4dcff;align-self:flex-end;border-bottom-right-radius:4px}.choices{display:grid;gap:9px;margin-top:8px}.choice{border:1px solid #ded5f6;background:white;padding:15px;border-radius:13px;text-align:left;color:#271a43;font-weight:600;cursor:pointer}.choice:hover,.choice:focus-visible{border-color:#693af0;background:#f8f5ff}form{display:flex;gap:8px;margin-top:12px}input{width:100%;min-width:0;border:1px solid #ded5f6;padding:14px;border-radius:12px;font:inherit}button.primary{border:0;border-radius:12px;padding:14px 18px;background:#693af0;color:white;font:inherit;font-weight:700;cursor:pointer}.footer{padding:14px 22px 22px;border-top:1px solid #eeeaf5;color:#80778e;font-size:12px}.review{background:#f7f5fc;border:1px solid #e9e3f3;padding:20px;border-radius:17px}.review p{margin:7px 0}.muted{color:#756f84}.error{color:#a51f3a;font-size:13px}a{color:#693af0}@media(max-width:520px){main{padding:20px 15px}.bubble{max-width:94%}}
</style></head><body><div class="shell"><header><div class="logo">P</div><div><strong>PULSE</strong><div class="sub">Dein persönlicher Coach · Kennenlernen</div></div></header><div class="bar"><div class="fill" id="progress"></div></div><main id="chat" aria-live="polite"></main><div class="footer">Deine Angaben werden erst nach deiner ausdrücklichen Bestätigung sicher übertragen. Noch keine Zahlung.</div></div>
<script>
(()=>{'use strict';
const steps=[{"id":"firstName","question":"Hey! 👋 Ich bin PULSE. Wie lautet dein Vorname?","type":"text","placeholder":"Vorname"},{"id":"lastName","question":"Und dein Nachname?","type":"text","placeholder":"Nachname"},{"id":"email","question":"Unter welcher E-Mail-Adresse können wir dich erreichen?","type":"email","placeholder":"name@beispiel.ch"},{"id":"phone","question":"Wie lautet deine Telefonnummer?","type":"tel","placeholder":"+41 ..."},{"id":"street","question":"Wie heisst deine Strasse und Hausnummer?","type":"text","placeholder":"Musterstrasse 12"},{"id":"postal","question":"Wie lautet deine Postleitzahl?","type":"text","placeholder":"9000"},{"id":"city","question":"In welchem Ort wohnst du?","type":"text","placeholder":"St. Gallen"},{"id":"country","question":"In welchem Land wohnst du?","options":["Schweiz","Deutschland","Österreich","Anderes Land"]},{"id":"birthDate","question":"Wann bist du geboren?","type":"date","placeholder":""},{"id":"sex","question":"Welche Angabe passt für deine körperbezogene Trainingsplanung?","options":["Weiblich","Männlich","Divers","Möchte ich nicht angeben"]},{"id":"height","question":"Wie gross bist du in cm?","type":"number","placeholder":"z. B. 175","min":100,"max":240},{"id":"weight","question":"Wie viel wiegst du aktuell in kg?","type":"number","placeholder":"z. B. 78","min":30,"max":350},{"id":"goal","question":"Was möchtest du als Erstes erreichen?","options":["Abnehmen & definieren","Muskelaufbau","Fitter & gesünder werden","Mehr Energie im Alltag","Ausdauer verbessern"]},{"id":"targetWeight","question":"Hast du ein Wunschgewicht? Du kannst die Frage überspringen.","type":"number","placeholder":"Wunschgewicht in kg (optional)","min":30,"max":350,"optional":true},{"id":"motivation","question":"Was motiviert dich persönlich, dein Ziel zu erreichen?","type":"text","placeholder":"Dein wichtigster Grund"},{"id":"challenge","question":"Was ist aktuell deine grösste Herausforderung?","options":["Wenig Zeit","Motivation und Konstanz","Ernährung im Alltag","Ich weiss nicht, wie ich trainieren soll","Etwas anderes"]},{"id":"job","question":"Was arbeitest du beruflich?","type":"text","placeholder":"Dein Beruf"},{"id":"activity","question":"Wie sieht dein Arbeitsalltag meistens aus?","options":["Überwiegend sitzend","Viel stehend","Viel gehend","Körperlich anstrengend"]},{"id":"currentTraining","question":"Wie häufig trainierst du momentan?","options":["Noch gar nicht","1–2× pro Woche","3–4× pro Woche","5× oder öfter"]},{"id":"plannedTraining","question":"Wie häufig möchtest du künftig trainieren?","options":["1–2× pro Woche","3× pro Woche","4× pro Woche","5× oder öfter"]},{"id":"days","question":"An welchen Tagen kannst du normalerweise trainieren? Mehrere Tage bitte mit Komma angeben.","type":"text","placeholder":"z. B. Mo, Mi, Fr"},{"id":"weeklyTime","question":"Wie viel Zeit kannst du insgesamt pro Woche investieren?","options":["1–2 Stunden","2–3 Stunden","3–5 Stunden","Mehr als 5 Stunden"]},{"id":"location","question":"Wo trainierst du am liebsten?","options":["Fitnessstudio","Zuhause","Draussen","Kombination"]},{"id":"gymMember","question":"Bist du Mitglied in einem Fitnessstudio?","options":["Ja","Nein"]},{"id":"equipment","question":"Welche Geräte oder welches Equipment stehen dir zur Verfügung?","type":"text","placeholder":"z. B. Gym, Hanteln, Matte – oder keines"},{"id":"duration","question":"Wie viel Zeit hast du normalerweise pro Training?","options":["20–30 Minuten","30–45 Minuten","45–60 Minuten","Über 60 Minuten"]},{"id":"experience","question":"Wie viel Trainingserfahrung hast du?","options":["Einsteiger","Etwas Erfahrung","Fortgeschritten"]},{"id":"diet","question":"Machst du derzeit eine Diät?","options":["Ja","Nein"]},{"id":"nutrition","question":"Welche Ernährungsform oder Einschränkungen sollen wir berücksichtigen?","type":"text","placeholder":"z. B. vegetarisch, kein Schwein – oder keine"},{"id":"allergies","question":"Hast du Allergien oder Lebensmittelunverträglichkeiten? Welche?","type":"text","placeholder":"z. B. Laktose, Nüsse – oder keine"},{"id":"medicalTreatment","question":"Bist du zurzeit in ärztlicher Behandlung?","options":["Ja","Nein"]},{"id":"medication","question":"Nimmst du derzeit Medikamente ein?","options":["Ja","Nein"]},{"id":"heart","question":"Hast oder hattest du Herz-Kreislauf-Beschwerden?","options":["Ja","Nein"]},{"id":"musculoskeletal","question":"Sind Beschwerden oder Einschränkungen am Bewegungsapparat bekannt?","options":["Ja","Nein"]},{"id":"respiratory","question":"Hast du Atemwegserkrankungen (z. B. Asthma)?","options":["Ja","Nein"]},{"id":"metabolic","question":"Hast du Stoffwechselerkrankungen (z. B. Schilddrüse oder Diabetes)?","options":["Ja","Nein"]},{"id":"healthDetails","question":"Falls du eine Gesundheitsfrage mit Ja beantwortet hast: Was sollten wir berücksichtigen? Andernfalls kannst du diese Frage überspringen.","type":"text","placeholder":"Details (optional)","optional":true},{"id":"smoking","question":"Rauchst du?","options":["Ja","Nein","Möchte ich nicht angeben"]},{"id":"source","question":"Wie hast du PULSE entdeckt?","options":["Google","Social Media","Empfehlung","10X Personal Training","Andere Quelle"]}];
const chat=document.getElementById('chat'),progress=document.getElementById('progress'),answers={};let i=0;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function bubble(text,who){chat.appendChild(el('div','bubble '+who,text))}
function draw(){progress.style.width=Math.round(i/steps.length*100)+'%';const s=steps[i];if(!s)return finish();bubble(typeof s.question==='function'?s.question(answers):s.question,'bot');const wrap=el('div','choices');chat.appendChild(wrap);
function next(value){answers[s.id]=value;bubble(String(value),'me');wrap.remove();i++;draw()}
if(s.options){s.options.forEach(v=>{const b=el('button','choice',v);b.type='button';b.onclick=()=>next(v);wrap.appendChild(b)})}
else{const form=el('form');const input=el('input');input.required=!s.optional;input.type=['number','email','tel','date'].includes(s.type)?s.type:'text';input.placeholder=s.placeholder||'';if(s.max&&s.type!=='number')input.maxLength=s.max;else if(s.type!=='number')input.maxLength=500;if(s.min)input.min=s.min;if(s.max&&s.type==='number')input.max=s.max;const b=el('button','primary','Weiter');b.type='submit';form.append(input,b);form.onsubmit=e=>{e.preventDefault();if(!input.reportValidity())return;const v=input.value.trim();if(!v&&!s.optional)return;next(v||'Keine Angabe')};wrap.appendChild(form);input.focus()}
window.scrollTo(0,document.body.scrollHeight)}
function finish(){progress.style.width='100%';bubble('Danke, '+answers.name+'! Dein persönliches Coaching-Profil ist vorbereitet. 💜','bot');const box=el('div','review');const title=el('h2',null,'Dein Coaching-Profil');box.appendChild(title);[['Name',answers.firstName+' '+answers.lastName],['Kontakt',answers.email],['Adresse',answers.street+', '+answers.postal+' '+answers.city],['Ziel',answers.goal],['Training',answers.plannedTraining],['Trainingsort',answers.location]].forEach(([k,v])=>box.appendChild(el('p',null,k+': '+v)));box.appendChild(el('p','muted','Deine Angaben sind aktuell nur in dieser Sitzung vorhanden und werden noch nicht an PULSE übermittelt. Die sichere Speicherung und der Checkout werden vor dem öffentlichen Start verbunden.'));const button=el('button','primary','Bald verfügbar – Checkout wird verbunden');button.disabled=true;button.style.opacity='.55';box.appendChild(button);chat.appendChild(box)}
draw();
})();
</script></body></html>

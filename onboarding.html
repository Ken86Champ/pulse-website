<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE – Dein persönliches Coaching beginnt hier</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#211936;background:#f7f5fc}*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:white;box-shadow:0 12px 70px #28165b12}header{padding:18px 24px;border-bottom:1px solid #eeeaf5;display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#693af0;color:white;font-weight:800}.sub{font-size:12px;color:#756f84}.bar{height:4px;background:#eeeaf5}.fill{height:100%;background:#693af0;transition:width .3s}main{flex:1;padding:28px 22px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:88%;padding:14px 17px;border-radius:17px;line-height:1.55;font-size:15px;white-space:pre-line}.bot{background:#f1eef9;align-self:flex-start;border-bottom-left-radius:4px}.me{background:#e4dcff;align-self:flex-end;border-bottom-right-radius:4px}.choices{display:grid;gap:9px;margin-top:8px}.choice{border:1px solid #ded5f6;background:white;padding:15px;border-radius:13px;text-align:left;color:#271a43;font-weight:600;cursor:pointer}.choice:hover,.choice:focus-visible{border-color:#693af0;background:#f8f5ff}form{display:flex;gap:8px;margin-top:12px}input{width:100%;min-width:0;border:1px solid #ded5f6;padding:14px;border-radius:12px;font:inherit}button.primary{border:0;border-radius:12px;padding:14px 18px;background:#693af0;color:white;font:inherit;font-weight:700;cursor:pointer}.footer{padding:14px 22px 22px;border-top:1px solid #eeeaf5;color:#80778e;font-size:12px}.review{background:#f7f5fc;border:1px solid #e9e3f3;padding:20px;border-radius:17px}.review p{margin:7px 0}.muted{color:#756f84}.error{color:#a51f3a;font-size:13px}a{color:#693af0}@media(max-width:520px){main{padding:20px 15px}.bubble{max-width:94%}}
form input,form select,form textarea{max-width:100%}form input[type=checkbox]{accent-color:#693af0}form .choice{width:auto} .review h2{font-size:20px;margin:0 0 10px} .review .primary{margin-top:8px}
/* Brand-aligned PULSE onboarding */
:root{--pulse:#643cf0;--pulse-ink:#191329;--pulse-muted:#756f84}
body{background:radial-gradient(ellipse at 80% 0%,#ece5ff 0%,#f8f6fe 42%,#fff 82%);color:var(--pulse-ink)}
.shell{max-width:850px;min-height:100dvh;background:transparent;box-shadow:none}
header{background:#ffffffed;border:1px solid #eee9f5;border-top:0;border-radius:0 0 20px 20px;box-shadow:0 10px 35px #3d207009;padding:20px 28px;gap:18px;flex-wrap:wrap}
.pulse-brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#191329;font-size:24px;font-weight:850;letter-spacing:.085em}
.brand-badge{height:46px;width:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(140deg,#9862ff,#4e22d9);box-shadow:0 9px 22px #6a42f138;color:#fff}
.brand-badge svg{width:30px;height:30px}
.header-divider{height:29px;width:1px;background:#e8e1f1}
header .sub{font-size:13px;font-weight:550}
.stage-heading{padding:40px 24px 4px;text-align:center}
.eyebrow{color:#693af0;font-size:11px;font-weight:850;letter-spacing:.14em}
.stage-heading h1{font-size:clamp(32px,5.5vw,54px);letter-spacing:-.055em;line-height:1.12;margin:10px 0 12px}
.stage-heading h1 em{font-style:normal;color:#643cf0}
.stage-heading p{margin:0;color:#756f84;font-size:15px}
.bar{height:5px;border-radius:99px;background:#eae3f7;margin:22px 24px 0;overflow:hidden}
.fill{background:linear-gradient(90deg,#9567ff,#643cf0)}
main{padding:24px 24px 40px;gap:18px}
.bubble.bot{background:#fff;border:1px solid #e9e2f5;box-shadow:0 10px 30px #321b610b;border-radius:20px 20px 20px 6px;padding:17px 20px}
.review{background:#fff;border:1px solid #e8e0f4;border-radius:23px;box-shadow:0 18px 55px #3b1d7512;padding:27px}
.review h2{font-size:23px!important;letter-spacing:-.04em}
form input:not([type=checkbox]),form select,form textarea{background:#fcfbff!important;border:1px solid #ded6ec!important;border-radius:12px!important;min-height:47px}
form input:focus,form select:focus,form textarea:focus{outline:2px solid #ab8bff;outline-offset:1px}
button.primary{background:linear-gradient(120deg,#7547ff,#5933e1);box-shadow:0 9px 22px #6537e633;border-radius:13px}
button.primary:hover{filter:brightness(1.06)}
.footer{text-align:center;border-top:0;color:#827a90;padding:10px 20px 28px}
@media(max-width:540px){header{padding:14px 16px;gap:10px}.pulse-brand{font-size:20px}.brand-badge{width:40px;height:40px}.brand-badge svg{width:26px;height:26px}.header-divider{display:none}header .sub{flex-basis:100%;padding-left:52px}.stage-heading{padding:26px 16px 0}main{padding:18px 13px 30px}.review{padding:18px}.bar{margin:18px 16px 0}}
</style></head><body><div class="shell"><header><a class="pulse-brand" href="index.html" aria-label="PULSE Startseite"><span class="brand-badge"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 16h7l4-8 5 16 4-8h8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7"/></svg></span><span>PULSE</span></a><span class="header-divider"></span><div class="sub">Dein persönliches Coaching beginnt hier</div></header><div class="bar"><div class="fill" id="progress"></div></div><div class="stage-heading"><span class="eyebrow">DEIN PERSÖNLICHER ASSISTENT 24/7</span><h1>Dein Weg beginnt <em>hier.</em></h1><p>PULSE lernt dich kennen und bereitet dein individuelles Coaching vor.</p></div><main id="chat" aria-live="polite"></main><div class="footer">Deine Angaben werden erst nach deiner ausdrücklichen Bestätigung sicher übertragen. Noch keine Zahlung.</div></div>
<script>
(()=>{'use strict';
const groups=[
{title:'Deine Kontaktdaten',message:'Hey! 👋 Ich bin PULSE. Schön, dass du da bist. Lass uns zuerst deine Kontaktdaten erfassen.',fields:[
['firstName','Vorname','text'],['lastName','Nachname','text'],['email','E-Mail-Adresse','email'],['phone','Telefonnummer','tel'],['street','Strasse und Hausnummer','text'],['postal','Postleitzahl','text'],['city','Ort','text'],['country','Land','select',['Schweiz','Deutschland','Österreich','Anderes Land']]]},
{title:'Über dich',message:'Super! Jetzt brauche ich ein paar Angaben für deine persönliche Planung.',fields:[
['birthDate','Geburtsdatum','date'],['sex','Geschlecht','select',['Weiblich','Männlich','Divers','Keine Angabe']],['height','Grösse in cm','number',100,240],['weight','Gewicht in kg','number',30,350],['job','Beruf','text'],['activity','Aktivität im Berufsalltag','select',['Überwiegend sitzend','Viel stehend','Viel gehend','Körperlich anstrengend']]]},
{title:'Deine Ziele',message:'Was möchtest du erreichen und was treibt dich an?',fields:[
['goal','Hauptziel','select',['Abnehmen & definieren','Muskelaufbau','Fitter & gesünder werden','Mehr Energie im Alltag','Ausdauer verbessern']],['targetWeight','Wunschgewicht in kg (falls kein Gewichtsziel: aktuelles Gewicht eintragen)','number',30,350],['motivation','Deine persönliche Motivation','textarea'],['challenge','Grösste Herausforderung','select',['Wenig Zeit','Motivation und Konstanz','Ernährung im Alltag','Unsicherheit beim Training','Anderes']]]},
{title:'Dein Training',message:'Damit dein Training wirklich in deinen Alltag passt:',fields:[
['currentTraining','Aktuelle Trainingshäufigkeit','select',['Noch gar nicht','1–2× pro Woche','3–4× pro Woche','5× oder öfter']],['plannedTraining','Gewünschte Trainingshäufigkeit','select',['1–2× pro Woche','3× pro Woche','4× pro Woche','5× oder öfter']],['days','Verfügbare Trainingstage (Mehrfachauswahl)','multi',['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag']],['weeklyTime','Wöchentliches Zeitbudget','select',['1–2 Stunden','2–3 Stunden','3–5 Stunden','Mehr als 5 Stunden']],['location','Trainingsort','select',['Fitnessstudio','Zuhause','Draussen','Kombination']],['gymMember','Fitnessstudio-Mitgliedschaft','select',['Ja','Nein']],['equipment','Verfügbares Equipment (falls keines: keines eintragen)','text'],['duration','Zeit pro Training','select',['20–30 Minuten','30–45 Minuten','45–60 Minuten','Über 60 Minuten']],['experience','Trainingserfahrung','select',['Einsteiger','Etwas Erfahrung','Fortgeschritten']]]},
{title:'Deine Ernährung',message:'Ein paar Fragen zu deiner Ernährung, damit wir deinen Plan passend gestalten.',fields:[
['diet','Machst du derzeit eine Diät?','select',['Ja','Nein']],['nutrition','Ernährungsweise / Regeln (falls keine: keine eintragen)','textarea'],['allergies','Allergien oder Unverträglichkeiten (falls keine: keine eintragen)','textarea']]},
{title:'Gesundheitscheck',message:'Für ein verantwortungsvolles Coaching brauchen wir diese Gesundheitsangaben. Bitte beantworte alle Fragen.',fields:[
['medicalTreatment','Zurzeit in ärztlicher Behandlung?','select',['Ja','Nein']],['medication','Nimmst du Medikamente?','select',['Ja','Nein']],['heart','Herz-Kreislauf-Beschwerden?','select',['Ja','Nein']],['musculoskeletal','Beschwerden am Bewegungsapparat?','select',['Ja','Nein']],['respiratory','Atemwegserkrankungen?','select',['Ja','Nein']],['metabolic','Stoffwechselerkrankungen?','select',['Ja','Nein']],['healthDetails','Gesundheitliche Details (falls keine: keine eintragen)','textarea'],['smoking','Rauchst du?','select',['Ja','Nein','Keine Angabe']]]},
{title:'Zum Abschluss',message:'Fast geschafft! Nur noch zwei letzte Angaben.',fields:[
['source','Wie hast du PULSE entdeckt?','select',['Google','Social Media','Empfehlung','10X Personal Training','Andere Quelle']],['confirmation','Ich bestätige, dass meine Angaben nach bestem Wissen richtig und vollständig sind.','checkbox']]}
];
const chat=document.getElementById('chat'),progress=document.getElementById('progress'),answers={};let index=0;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function bubble(text,who){chat.appendChild(el('div','bubble '+who,text))}
function field([id,label,type,p1,p2]){const box=el('div','field');box.style.marginBottom='13px';const lab=el('label',null,label+' *');lab.style.cssText='display:block;font-weight:650;font-size:13px;margin-bottom:5px';let input;
if(type==='select'){input=el('select');const opt=el('option',null,'Bitte auswählen');opt.value='';input.appendChild(opt);p1.forEach(v=>{const o=el('option',null,v);o.value=v;input.appendChild(o)})}
else if(type==='textarea'){input=el('textarea');input.rows=2;input.maxLength=1000}
else if(type==='multi'){input=el('div');input.dataset.multi='1';input.style.cssText='display:flex;flex-wrap:wrap;gap:7px';p1.forEach(v=>{const l=el('label');l.style.cssText='padding:8px;border:1px solid #ded5f6;border-radius:10px;font-size:13px';const c=el('input');c.type='checkbox';c.value=v;c.style.width='auto';l.append(c,document.createTextNode(' '+v));input.appendChild(l)})}
else{input=el('input');input.type=type;if(type==='number'){input.min=p1;input.max=p2;input.step='any'}if(type==='text')input.maxLength=200;if(type==='tel')input.pattern='[+0-9 ()\\-]{7,25}';if(type==='date')input.max=new Date().toISOString().slice(0,10)}
if(type==='checkbox'){input=el('input');input.type='checkbox';input.style.width='auto'}
input.dataset.key=id;if(type!=='multi')input.required=true;
if(type==='checkbox'){lab.prepend(input);box.appendChild(lab)}else{box.append(lab,input)}
if(answers[id]!==undefined){if(type==='multi'){input.querySelectorAll('input').forEach(c=>c.checked=answers[id].includes(c.value))}else if(type==='checkbox')input.checked=answers[id]===true;else input.value=answers[id]}
if(type==='textarea'||type==='select')input.style.cssText='width:100%;border:1px solid #ded5f6;border-radius:12px;padding:12px;font:inherit;background:white';return box}
function draw(){progress.style.width=Math.round(index/groups.length*100)+'%';const g=groups[index];if(!g)return finish();chat.replaceChildren();bubble(g.message,'bot');const card=el('div','review');card.appendChild(el('h2',null,g.title));card.style.marginTop='10px';const form=el('form');form.style.cssText='display:block;margin-top:18px';g.fields.forEach(f=>form.appendChild(field(f)));const error=el('p','error');error.setAttribute('role','alert');const actions=el('div');actions.style.cssText='display:flex;justify-content:space-between;gap:10px;margin-top:14px';if(index){const back=el('button','choice','Zurück');back.type='button';back.onclick=()=>{index--;draw()};actions.appendChild(back)}const next=el('button','primary',index===groups.length-1?'Zusammenfassung ansehen':'Weiter');next.type='submit';actions.appendChild(next);form.append(error,actions);form.onsubmit=e=>{e.preventDefault();error.textContent='';const draft={};for(const [id,label,type] of g.fields){const wrapper=form.querySelector('[data-key="'+id+'"]');let value;if(type==='multi')value=[...wrapper.querySelectorAll('input:checked')].map(c=>c.value);else if(type==='checkbox')value=wrapper.checked;else value=wrapper.value.trim();if(type==='multi'&&!value.length||type==='checkbox'&&!value||type!=='multi'&&type!=='checkbox'&&!value){error.textContent='Bitte alle Pflichtfelder ausfüllen: '+label;wrapper.focus?.();return}if(type==='number'&&(!Number.isFinite(Number(value))||Number(value)<Number(wrapper.min)||Number(value)>Number(wrapper.max))){error.textContent='Bitte einen gültigen Wert eingeben: '+label;wrapper.focus();return}if(type==='email'&&!wrapper.checkValidity()||type==='tel'&&!wrapper.checkValidity()||type==='date'&&!wrapper.checkValidity()){error.textContent='Bitte die Angabe prüfen: '+label;wrapper.focus();return}draft[id]=value}Object.assign(answers,draft);index++;draw()};card.appendChild(form);chat.appendChild(card);window.scrollTo(0,0)}
function finish(){progress.style.width='100%';chat.replaceChildren();bubble('Danke, '+answers.firstName+'! 💜 Deine Angaben sind vollständig erfasst.','bot');const box=el('div','review');box.appendChild(el('h2',null,'Dein Coaching-Profil'));[['Name',answers.firstName+' '+answers.lastName],['E-Mail',answers.email],['Adresse',answers.street+', '+answers.postal+' '+answers.city+', '+answers.country],['Ziel',answers.goal],['Training',answers.plannedTraining],['Trainingstage',answers.days.join(', ')]].forEach(([k,v])=>box.appendChild(el('p',null,k+': '+v)));box.appendChild(el('p','muted','Dies ist eine Vorschau. Die Angaben sind noch nicht serverseitig gespeichert. Zahlung und sichere Speicherung werden erst nach Fertigstellung aktiviert.'));const back=el('button','choice','Angaben bearbeiten');back.onclick=()=>{index=0;draw()};box.appendChild(back);const button=el('button','primary','Checkout wird verbunden');button.disabled=true;button.style.opacity='.55';box.appendChild(button);chat.appendChild(box)}
draw();
})();
</script></body></html>

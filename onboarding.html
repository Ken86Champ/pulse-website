function draw(){updateChrome();const oldToolbar=document.getElementById('pulseToolbar');if(oldToolbar)oldToolbar.remove();const toolbar=el('div');toolbar.id='pulseToolbar';toolbar.style.cssText='display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0';const lang=el('select');lang.setAttribute('aria-label','Language');lang.style.cssText='padding:9px;border-radius:10px;border:1px solid #d9cff0;background:white';[['de','🇨🇭 Deutsch'],['en','🇬🇧 English'],['fr','🇫🇷 Français'],['it','🇮🇹 Italiano'],['es','🇪🇸 Español']].forEach(([code,name])=>{const opt=el('option',null,name);opt.value=code;lang.appendChild(opt)});lang.value=language;lang.onchange=()=>{const current=chat.querySelector('form');if(current&&groups[index])saveDraft(current,groups[index]);language=lang.value;document.documentElement.lang=language;draw()};toolbar.append(lang);chat.parentElement.insertBefore(toolbar,chat);progress.style.width=Math.round(index/groups.length*100)+'%';const g=groups[index];if(!g)return finish();if(window.pulseOnboardingController)window.pulseOnboardingController.abort();window.pulseOnboardingController=new AbortController();window.pulseOnboardingSignal=window.pulseOnboardingController;chat.replaceChildren();if(index&&answers.firstName)bubble(tr('Weiter mit')+' '+tr(g.title)+' ✓','me');bubble(tr(g.message),'bot');const card=el('div','review');card.appendChild(el('h2',null,tr(g.title)));card.style.marginTop='10px';const form=el('form');form.noValidate=true;form.style.cssText='display:block;margin-top:18px';if(g.fields.some(f=>f[0]==='medicalTreatment'))form.appendChild(legalLinks(true));g.fields.forEach(f=>form.appendChild(field(f)));if(index===groups.length-1)form.appendChild(legalLinks());const error=el('p','error');error.setAttribute('role','alert');const actions=el('div');actions.style.cssText='display:flex;justify-content:space-between;gap:10px;margin-top:14px';if(index){const back=el('button','choice',tr('Zurück'));back.type='button';ba function legalLinks(privacyOnly=false){
  const [privacy,terms]=privacyLinks[language];
  const links=el('p','muted');
  const pages=[[privacy,'/datenschutz.html#onboarding']];
  if(!privacyOnly)pages.push([terms,'/agb.html']);
  for(const [title,url] of pages){
    const link=el('a',null,title);
    link.href=url;link.target='_blank';link.rel='noopener';
    if(links.childNodes.length)links.append(' · ');
    links.appendChild(link);
  }
  return links;
}
function finish(){
  progress.style.width='100%';
  chat.replaceChildren();
  bubble(tr('Danke')+', '+answers.firstName+'! 💜 '+tr('Du kannst deine Angaben jetzt überprüfen.'),'bot');
  const card=el('div','review');
  card.appendChild(el('h2',null,tr('Dein Coaching-Profil')));
  for(const [i,group] of groups.entries()){
    const section=el('details');
    section.appendChild(el('summary',null,tr(group.title)));
    for(const [id,label,type] of group.fields){
      const value=answers[id];
      if(!value||value===true||(Array.isArray(value)&&!value.length))continue;
      const display=type==='country'?localizedCountries().find(c=>c.code===value)?.name:
        Array.isArray(value)?value.map(tr).join(', '):type==='select'?tr(value):value;
      section.appendChild(el('p',null,tr(label)+' · '+display));
    }
    const edit=el('button','choice',tr('Angaben bearbeiten'));
    edit.type='button';
    edit.onclick=()=>{index=i;draw()};
    section.appendChild(edit);
    card.appendChild(section);
  }
  card.appendChild(el('p','muted',tr(paymentTexts[0])));
  card.appendChild(legalLinks());
  const err=el('p','error');
  err.setAttribute('role','alert');
  const button=el('button','primary',tr('Jetzt sicher zum Checkout'));
  button.type='button';
  button.onclick=async()=>{
    button.disabled=true;
    button.textContent=tr('Bitte warten …');
    err.textContent='';
    const payload=JSON.stringify({answers,consentVersion,locale:language});
    if(payload!==attemptPayload){attemptPayload=payload;attemptId=crypto.randomUUID()}
    try{
      const response=await fetch('/api/secure-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...JSON.parse(payload),attemptId})});
      const data=await response.json();
      if(!response.ok||!data.checkoutUrl||new URL(data.checkoutUrl).origin!=='https://checkout.stripe.com')throw new Error('Checkout unavailable');
      window.location.assign(data.checkoutUrl);
    }catch{
      err.textContent=tr('Der sichere Checkout ist noch nicht verfügbar. Es wurden keine Zahlungsdaten erfasst.');
      button.disabled=false;
      button.textContent=tr('Jetzt sicher zum Checkout');
    }
  };
  card.append(err,button);
  chat.appendChild(card);
}
async function showCancellation(id){
  const notice=el('p','review',tr('Bitte warten …'));
  notice.setAttribute('role','status');
  document.querySelector('.stage-heading').after(notice);
  try{
    const response=await fetch('/api/checkout-cancel',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({attemptId:id})});
    const data=await response.json();
    notice.textContent=tr(paymentTexts[data.status==='cancelled'?1:2]);
    if(data.status==='cancelled')history.replaceState(null,'',location.pathname+location.search);
  }catch{notice.textContent=tr(paymentTexts[2])}
}

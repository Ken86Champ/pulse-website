else if(type==='equipment'){input=el('div');input.className='equipment-groups';const sections=[['Körpergewicht & Zubehör',['Keines','Trainingsmatte','Klimmzugstange','TRX / Schlingentrainer']],['Freie Gewichte',['Kurzhanteln','Langhantel / Gewichte','Kettlebells']],['Kraftgeräte & Stationen',['Trainingsbank','Squat Rack','Kabelzug / Kraftstation']],['Bänder & Mobility',['Widerstandsbänder','Minibands','Faszienrolle']],['Cardiogeräte',['Laufband','Walking Pad','Crosstrainer','Ergometer / Heimtrainer','Spinning-Bike','Liegeergometer','Rudergerät','SkiErg','AirBike','Stepper','Stairmaster','Springseil']],['Outdoor & Sonstiges',['Fahrrad','Outdoor-Fitnesspark','Anderes']]];const sync=()=>{input.querySelectorAll('details').forEach(d=>{const n=d.querySelectorAll('input:checked').length;d.querySelector('.eq-count').textContent=n+' '+tr('ausgewählt')})};sections.forEach(([name,items])=>{const details=el('details','eq-section');const summary=el('summary');summary.appendChild(el('span','eq-name',tr(name)));summary.appendChild(el('span','eq-count','0 '+tr('ausgewählt')));details.appendChild(summary);const grid=el('div','eq-options');items.forEach(v=>{const label=el('label','eq-option');const check=el('input');check.type='checkbox';check.value=v;check.checked=Array.isArray(answers[id])&&answers[id].includes(v);label.append(check,document.createTextNode(tr(v)));grid.appendChild(label);check.addEventListener('change',()=>{if(check.checked&&v==='Keines')input.querySelectorAll('input').forEach(c=>{if(c!==check)c.checked=false});else if(check.checked)input.querySelector('input[value="Keines"]').checked=false;sync()})});details.appendChild(grid);input.appendChild(details)});sync();input.querySelectorAll('details').forEach(d=>{if(d.querySelector('input:checked'))d.open=true})}
else if(type==='multi'){input=el('div');input.dataset.multi='1';input.className='choice-grid';p1.forEach(v=>{const l=el('label','chip');const c=el('input');c.type='checkbox';c.value=v;l.append(c,document.createTextNode(tr(v)));input.appendChild(l);c.addEventListener('change',()=>{if(c.checked&&['Keine','Keine besonderen Regeln','Keines'].includes(v)){input.querySelectorAll('input').forEach(other=>{if(other!==c)other.checked=false})}else if(c.checked){input.querySelectorAll('input').forEach(other=>{if(['Keine','Keine besonderen Regeln','Keines'].includes(other.value))other.checked=false})}input.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('selected',ch.querySelector('input').checked))})})}
else{input=el('input');input.type=type==='optionalNumber'?'number':type;if(type==='number'||type==='optionalNumber'){input.min=p1;input.max=p2;input.step='any'}if(type==='text')input.maxLength=200;if(type==='tel')input.pattern='[+0-9 ()\\-]{7,25}';if(type==='date')input.max=new Date().toISOString().slice(0,10)}

function draw(){const oldToolbar=document.getElementById('pulseToolbar');if(oldToolbar)oldToolbar.remove();const toolbar=el('div');toolbar.id='pulseToolbar';toolbar.style.cssText='display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0';const lang=el('select');lang.setAttribute('aria-label','Language');lang.style.cssText='padding:9px;border-radius:10px;border:1px solid #d9cff0;background:white';[['de','🇨🇭 Deutsch'],['en','🇬🇧 English'],['fr','🇫🇷 Français'],['it','🇮🇹 Italiano'],['es','🇪🇸 Español']].forEach(([code,name])=>{const opt=el('option',null,name);opt.value=code;lang.appendChild(opt)});lang.value=language;lang.onchange=()=>{const current=chat.querySelector('form');if(current&&groups[index])saveDraft(current,groups[index]);language=lang.value;document.documentElement.lang=language;draw()};toolbar.append(lang);chat.parentElement.insertBefore(toolbar,chat);progress.style.width=Math.round(index/groups.length*100)+'%';const g=groups[index];if(!g)return finish();if(window.pulseOnboardingController)window.pulseOnboardingController.abort();window.pulseOnboardingController=new AbortController();window.pulseOnboardingSignal=window.pulseOnboardingController;chat.replaceChildren();if(index&&answers.firstName)bubble('Weiter mit '+g.title+' ✓','me');bubble(tr(g.message),'bot');const card=el('div','review');card.appendChild(el('h2',null,tr(g.title)));card.style.marginTop='10px';const form=el('form');form.noValidate=true;form.style.cssText='display:block;margin-top:18px';g.fields.forEach(f=>form.appendChild(field(f)));const error=el('p','error');error.setAttribute('role','alert');const actions=el('div');actions.style.cssText='display:flex;justify-content:space-between;gap:10px;margin-top:14px';if(index){const back=el('button','choice',tr('Zurück'));back.type='button';back.onclick=()=>{saveDraft(form,g);index--;draw()};actions.appendChild(back)}const next=el('button','primary',tr(index===groups.length-1?'Zusammenfassung ansehen':'Wei

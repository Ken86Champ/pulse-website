<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PULSE – Zahlung wird geprüft</title><style>body{margin:0;background:#f7f5fc;color:#211936;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{max-width:520px;margin:20px;padding:36px;border-radius:24px;background:#fff;box-shadow:0 10px 45px #32225c16}h1{font-size:26px}p{line-height:1.6}a{color:#693af0}</style></head><body><main class="card"><h1>PULSE 💜</h1><p id="status" role="status" aria-live="polite">Wir prüfen deine Zahlung und richten dein Coaching ein …</p><p>Bitte schliesse diese Seite erst, wenn die Bestätigung angezeigt wird.</p><a href="/">Zur Startseite</a></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('session_id');const out=document.getElementById('status');if(!id){out.textContent='Es wurde keine Zahlungssitzung gefunden.';return}
for(let n=0;n<10;n++){try{const r=await fetch('/api/checkout-status?session_id='+encodeURIComponent(id),{cache:'no-store'});const j=await r.json();if(j.status==='coaching_setup_required'){out.textContent='Deine Zahlung ist bestätigt! Dein persönliches PULSE-Coaching wird eingerichtet. Die weiteren Schritte werden nach der Einrichtung bestätigt.';return}if(j.status==='invalid'||j.status==='not_found'){out.textContent='Die Zahlung konnte noch nicht zugeordnet werden. Bitte kontaktiere den PULSE-Support.';return}}catch(e){}await new Promise(resolve=>setTimeout(resolve,2500))}
out.textContent='Deine Zahlung wird noch verarbeitet. Bitte lade diese Seite in wenigen Minuten erneut. Falls du bereits bezahlt hast, führe keine zweite Zahlung durch.'})();
</script></body></html>

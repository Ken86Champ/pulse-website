<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>PULSE</title>
  <style>
    body{margin:0;background:#f7f5fc;color:#211936;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
    .card{max-width:520px;margin:20px;padding:36px;border-radius:24px;background:#fff;box-shadow:0 10px 45px #32225c16}
    h1{font-size:26px}p{line-height:1.6}a{color:#693af0}
  </style>
</head>
<body>
  <main class="card">
    <h1>PULSE 💜</h1>
    <p id="status" role="status" aria-live="polite">Wir prüfen deine Zahlung …</p>
    <a id="home" href="/">Zur Startseite</a>
  </main>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const id = params.get('session_id');
      const language = params.get('lang');
      const translations = {
        de: ['Wir prüfen deine Zahlung …', 'Deine Zahlung ist bestätigt. Wir richten dein PULSE-Coaching persönlich ein.', 'Die Zahlung wurde abgebrochen oder ist fehlgeschlagen.', 'Die Zahlung wird noch geprüft. Falls du bezahlt hast, lade diese Seite später erneut oder kontaktiere PULSE, bevor du erneut bezahlst.', 'Wir konnten die Zahlung nicht zuordnen. Bitte kontaktiere PULSE.', 'Zur Startseite'],
        en: ['We’re checking your payment …', 'Payment confirmed. We’ll personally set up your PULSE coaching.', 'Payment was cancelled or unsuccessful.', 'Payment is still being checked. If you paid, reload this page later or contact PULSE before paying again.', 'We couldn’t find this payment. Please contact PULSE.', 'Back to home'],
        fr: ['Nous vérifions ton paiement …', 'Paiement confirmé. Nous allons configurer ton coaching PULSE personnellement.', 'Le paiement a été annulé ou a échoué.', 'Nous vérifions encore le paiement. Si tu as payé, recharge la page plus tard ou contacte PULSE avant de payer à nouveau.', 'Nous n’avons pas retrouvé ce paiement. Contacte PULSE.', 'Retour à l’accueil'],
        it: ['Stiamo verificando il pagamento …', 'Pagamento confermato. Configureremo personalmente il tuo coaching PULSE.', 'Il pagamento è stato annullato o non è riuscito.', 'Il pagamento è ancora in verifica. Se hai pagato, ricarica la pagina più tardi o contatta PULSE prima di pagare di nuovo.', 'Non abbiamo trovato il pagamento. Contatta PULSE.', 'Torna alla pagina iniziale'],
        es: ['Estamos verificando tu pago …', 'Pago confirmado. Configuraremos personalmente tu coaching PULSE.', 'El pago se canceló o no se realizó.', 'El pago sigue verificándose. Si ya pagaste, vuelve a cargar esta página más tarde o contacta con PULSE antes de pagar otra vez.', 'No encontramos el pago. Contacta con PULSE.', 'Volver al inicio']
      };
      const locale = Object.hasOwn(translations, language) ? language : 'de';
      const [checking, paid, failed, pending, unknown, home] = translations[locale];
      document.documentElement.lang = locale;
      document.getElementById('home').textContent = home;
      const status = document.getElementById('status');
      status.textContent = checking;
      if (!id) { status.textContent = unknown; return; }
      for (let attempt = 0; attempt < 10; attempt++) {
        try {
          const response = await fetch('/api/checkout-status?session_id=' + encodeURIComponent(id), { cache: 'no-store' });
          const data = await response.json();
          if (data.status === 'coaching_setup_required') { status.textContent = paid; return; }
          if (['cancelled', 'payment_failed'].includes(data.status)) { status.textContent = failed; return; }
          if (['invalid', 'not_found'].includes(data.status)) { status.textContent = unknown; return; }
        } catch {}
        await new Promise(resolve => setTimeout(resolve, 2500));
      }
      status.textContent = pending;
    })();
  </script>
</body>
</html>
